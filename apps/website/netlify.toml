# netlify.toml

[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Optional: Pre-configured for future use
[context.production.environment]
  NEXT_PUBLIC_API_URL = "https://api.ripplebase.app"

[context.dev.environment]
  NEXT_PUBLIC_API_URL = "https://api.dev.ripplebase.app"